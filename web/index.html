<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Warble</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, system-ui, sans-serif;
    background: #111418; color: #e6e9ee;
    display: flex; justify-content: center; padding: 2rem 1rem;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 1.5rem; }
  #controls { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 1rem; padding: 0.7rem 1.4rem; border-radius: 8px;
    border: none; cursor: pointer; background: #2a323d; color: #e6e9ee;
  }
  button:disabled { opacity: 0.4; cursor: default; }
  #btn-record { background: #d84a4a; }
  #btn-record.recording { background: #f9a14f; color: #111418; }
  #btn-transcribe { background: #4f9cf9; }
  audio { width: 100%; margin-top: 1rem; display: none; }
  #status { color: #9aa4b2; font-size: 0.85rem; margin-top: 1rem; min-height: 1.2em; }
  #result-wrap { margin-top: 1.5rem; display: none; }
  #result {
    width: 100%; min-height: 8rem; padding: 1rem; font: inherit; font-size: 1.1rem;
    line-height: 1.5; background: #1a2027; color: #e6e9ee;
    border: none; border-radius: 12px; resize: vertical;
  }
  #meta { color: #9aa4b2; font-size: 0.8rem; margin-top: 0.5rem; }
  #btn-copy { margin-top: 0.5rem; font-size: 0.85rem; padding: 0.4rem 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Warble — your voice, your model</h1>

  <div id="controls">
    <button id="btn-record">Record</button>
    <button id="btn-transcribe" disabled>Transcribe</button>
  </div>

  <audio id="playback" controls></audio>
  <div id="status"></div>

  <div id="result-wrap">
    <textarea id="result" spellcheck="false"></textarea>
    <div id="meta"></div>
    <button id="btn-copy">Copy</button>
  </div>
</main>

<script>
let stream, recorder, chunks = [], blob = null;

const statusEl = document.getElementById('status');
const playback = document.getElementById('playback');
const btnRecord = document.getElementById('btn-record');
const btnTranscribe = document.getElementById('btn-transcribe');
const resultWrap = document.getElementById('result-wrap');
const resultEl = document.getElementById('result');
const metaEl = document.getElementById('meta');
const btnCopy = document.getElementById('btn-copy');

btnRecord.onclick = async () => {
  if (recorder && recorder.state === 'recording') {
    recorder.stop();
    return;
  }
  if (!stream) {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    blob = new Blob(chunks, { type: recorder.mimeType });
    playback.src = URL.createObjectURL(blob);
    playback.style.display = 'block';
    btnRecord.textContent = 'Record';
    btnRecord.classList.remove('recording');
    btnTranscribe.disabled = false;
    statusEl.textContent = 'Ready — hit Transcribe.';
  };
  recorder.start();
  btnRecord.textContent = 'Stop';
  btnRecord.classList.add('recording');
  btnTranscribe.disabled = true;
  statusEl.textContent = 'Recording…';
};

btnTranscribe.onclick = async () => {
  if (!blob) return;
  btnTranscribe.disabled = true;
  btnRecord.disabled = true;
  statusEl.textContent = 'Transcribing…';
  const ext = (blob.type.includes('mp4') ? '.mp4' : blob.type.includes('ogg') ? '.ogg' : blob.type.includes('wav') ? '.wav' : '.webm');
  const form = new FormData();
  form.append('file', blob, `audio${ext}`);
  try {
    const res = await fetch('/transcribe', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);
    resultEl.value = data.text;
    metaEl.textContent = `${data.audio_duration_s}s of audio transcribed in ${data.elapsed_s}s`;
    resultWrap.style.display = 'block';
    statusEl.textContent = '';
  } catch (e) {
    statusEl.textContent = `Failed: ${e.message}`;
  } finally {
    btnTranscribe.disabled = false;
    btnRecord.disabled = false;
  }
};

btnCopy.onclick = async () => {
  await navigator.clipboard.writeText(resultEl.value);
  btnCopy.textContent = 'Copied';
  setTimeout(() => (btnCopy.textContent = 'Copy'), 1200);
};
</script>
</body>
</html>
