[project]
name = "warble"
version = "0.1.0"
description = "Personalized speech-to-text: fine-tuned Whisper on your own voice"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "transformers>=4.49",
    "datasets>=3.2",
    "accelerate>=1.2",
    "jiwer>=3.0",
    "soundfile>=0.13",
    "librosa>=0.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.19",
    "faster-whisper>=1.1",
    "ctranslate2>=4.5",
    "sounddevice>=0.5.5",
    "pynput>=1.8.2",
    "websockets>=17.0.1",
]

[tool.uv]
package = false
